:root {
  color-scheme: light;
  --font-sans: 'Manrope', system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, "SF Mono", Menlo, monospace;
  --page: #eef0f2;
  --card: #ffffff;
  --ink: #0f1417;
  --ink-2: #4a5560;
  --muted: #8794a0;
  --track: #e3e7ea;
  --line: rgba(15,20,23,0.09);
  --line-soft: rgba(15,20,23,0.06);
  --line-strong: rgba(15,20,23,0.10);
  --axis: rgba(15,20,23,0.14);
  --input-line: rgba(15,20,23,0.12);
  --on-ink: #f2f4f5;
  --on-ink-mute: #9aa7b2;
  --on-ink-line: rgba(255,255,255,0.16);
  --on-ink-fill: rgba(255,255,255,0.06);
  --good: #1f8a4c;
  --warn: #b8912a;
  --bad: #c33b3b;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d1114;
    --card: #161b20;
    --ink: #eaeef1;
    --ink-2: #9aa7b3;
    --muted: #79868f;
    --track: #1e242a;
    --line: rgba(234,238,241,0.13);
    --line-soft: rgba(234,238,241,0.08);
    --line-strong: rgba(234,238,241,0.17);
    --axis: rgba(234,238,241,0.24);
    --input-line: rgba(234,238,241,0.26);
    --on-ink: #0d1114;
    --on-ink-mute: #67737c;
    --on-ink-line: rgba(13,17,20,0.22);
    --on-ink-fill: rgba(13,17,20,0.07);
    --good: #4fbf7a;
    --warn: #d8ad3f;
    --bad: #e8736f;
  }
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-sans); line-height: 1.4; }
a { color: var(--ink-2); text-decoration: none; }
a:hover { color: var(--ink); }
button, input { font-family: inherit; }

.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 20px 40px; }

.site-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.site-header .brand { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
.freshness { margin-left: auto; display: flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
.freshness .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--good); flex: none; }
.freshness.stale { color: var(--bad); }
.freshness.stale .dot { background: var(--bad); }

.layout { display: grid; grid-template-columns: 320px 1fr; gap: 20px; }
.col-left, .col-right { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.card h2 { font-size: 13.5px; font-weight: 700; margin: 0; }

/* --- AQI hero card --- */
.hero-card { padding: 22px; }
.eyebrow { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.aqi-row { display: flex; align-items: flex-end; gap: 12px; margin-top: 12px; }
.aqi-num { font-family: var(--font-mono); font-size: 58px; font-weight: 500; line-height: 0.84; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; }
.aqi-unit { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; line-height: 1.4; }
.badge { display: inline-block; margin-top: 14px; font-size: 12.5px; font-weight: 600; padding: 5px 11px; border-radius: 6px; }
.badge[hidden] { display: none; }
.scale { position: relative; height: 5px; border-radius: 3px; margin-top: 18px;
  background: linear-gradient(90deg, #6fce4e 0 16.667%, #efd23c 16.667% 33.333%, #f0993d 33.333% 50%, #e05252 50% 66.667%, #96609c 66.667% 83.333%, #8a3550 83.333% 100%); }
.scale-marker { position: absolute; top: -5px; width: 2px; height: 15px; border-radius: 1px; background: var(--ink); box-shadow: 0 0 0 3px var(--card); transform: translateX(-50%); }
.verdict-title { font-size: 22px; line-height: 1.18; font-weight: 700; letter-spacing: -0.02em; margin: 24px 0 0; }
.verdict-body { font-size: 14px; line-height: 1.5; color: var(--ink-2); margin: 10px 0 0; }
.hero-note { font-size: 13.5px; color: var(--muted); margin: 10px 0 0; }

.actions { margin-top: 20px; padding-top: 6px; border-top: 1px solid var(--line); display: flex; flex-direction: column; }
.actions[hidden] { display: none; }
.action-row { display: flex; align-items: center; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
.action-row .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.action-name { font-size: 13.5px; color: var(--ink-2); }
.action-value { margin-left: auto; font-size: 13.5px; font-weight: 600; text-align: right; }

.hero-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
.hero-section-head { display: flex; align-items: baseline; gap: 9px; margin-bottom: 4px; }
.hero-section-head .u { font-family: var(--font-mono); font-size: 10px; color: var(--muted); }

.hours { display: flex; align-items: flex-end; gap: 2px; height: 52px; margin-top: 14px; }
.hours .bar { flex: 1; border-radius: 2px 2px 0 0; background: var(--line-soft); min-height: 3px; }
.hours-labels { display: flex; justify-content: space-between; margin-top: 7px; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }

.summary-row { display: flex; align-items: baseline; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
.summary-row:last-child { border-bottom: 0; }
.summary-name { font-size: 13.5px; color: var(--ink-2); }
.summary-note { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.summary-value { margin-left: auto; font-family: var(--font-mono); font-size: 19px; font-weight: 500; letter-spacing: -0.02em; }

/* --- chart card --- */
.chart-card { padding: 20px 22px 18px; flex: 1; display: flex; flex-direction: column; }
.chart-head { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
.chart-head .u { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.tabs { margin-left: auto; display: flex; gap: 2px; border: 1px solid var(--input-line); border-radius: 8px; padding: 2px; }
.tab { font: inherit; font-size: 12px; padding: 6px 12px; border: 0; border-radius: 6px; cursor: pointer; background: transparent; color: var(--ink-2); }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); font-weight: 600; }

.chart-row { display: flex; gap: 12px; flex: 1; min-height: 240px; }
.y-axis { width: 30px; align-self: stretch; position: relative; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.y-axis .yfix { position: absolute; right: 0; }
.y-axis .ytop { top: -5px; }
.y-axis .ybottom { bottom: -5px; }
.y-axis .gridlabel { position: absolute; right: 0; transform: translateY(-50%); }

.chart-plot { flex: 1; position: relative; cursor: crosshair; }
.gridline { position: absolute; left: 0; right: 0; border-top: 1px dashed; opacity: 0.45; }
.chart-baseline { position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid var(--axis); }
.chart-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.chart-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13.5px; }
.chart-empty[hidden] { display: none; }
.cursor-line { position: absolute; top: 0; bottom: 0; width: 1px; pointer-events: none; background: var(--axis); display: none; }
.cursor-dot { position: absolute; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--card); pointer-events: none; transform: translate(-50%, -50%); display: none; }
.tooltip { position: absolute; top: 4px; transform: translateX(-50%); pointer-events: none; background: var(--card);
  border: 1px solid var(--line-strong); border-radius: 10px; padding: 9px 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.16);
  white-space: nowrap; display: none; }
.tooltip .tw { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.tooltip .ta { display: flex; align-items: baseline; gap: 8px; margin-top: 5px; }
.tooltip .ta .n { font-family: var(--font-mono); font-size: 22px; font-weight: 500; letter-spacing: -0.03em; }
.tooltip .ta .c { font-size: 12.5px; font-weight: 600; }
.tooltip .tr, .tooltip .tp { font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); margin-top: 4px; }

.x-labels { display: flex; justify-content: space-between; margin: 9px 0 0 42px; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }

/* --- metrics row --- */
.metrics-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.metric-card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 15px 12px; cursor: pointer; transition: border-color .15s, background-color .15s; }
.metric-card.active { border-color: var(--ink); background: var(--track); }
.metric-name { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.metric-value { display: flex; align-items: baseline; gap: 4px; margin-top: 8px; font-family: var(--font-mono); font-size: 22px; font-weight: 500; letter-spacing: -0.03em; }
.metric-value .unit { font-family: var(--font-sans); font-size: 11px; color: var(--muted); font-weight: 400; }
.metric-spark { width: 100%; height: 22px; display: block; margin-top: 10px; overflow: visible; }
.metric-trend { margin-top: 9px; font-size: 11.5px; color: var(--muted); }

/* --- telegram card --- */
.telegram-card { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; background: var(--ink); border-radius: 14px; padding: 20px 22px; }
.telegram-card h2 { color: var(--on-ink); }
.telegram-card p { font-size: 13.5px; color: var(--on-ink-mute); margin: 6px 0 0; }
.telegram-form { display: flex; gap: 8px; }
.telegram-form input { font-size: 13.5px; padding: 10px 13px; width: 170px; border: 1px solid var(--on-ink-line); border-radius: 8px; background: var(--on-ink-fill); color: var(--on-ink); }
.telegram-form button { font-size: 13.5px; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--on-ink); color: var(--ink); cursor: pointer; }
.telegram-form input:disabled, .telegram-form button:disabled { opacity: 0.55; cursor: not-allowed; }
.telegram-note { grid-column: 1 / -1; font-size: 11.5px; color: var(--on-ink-mute); margin-top: -8px; }

footer { color: var(--muted); font-size: 12.5px; margin-top: 20px; font-family: var(--font-mono); display: flex; gap: 14px; }
footer a { margin-left: auto; }

@media (max-width: 899px) {
  .wrap { padding: 18px 14px 32px; }
  .layout { grid-template-columns: 1fr; }
  .aqi-num { font-size: 48px; }
  .verdict-title { font-size: 20px; }

  .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
  .action-row { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; border-bottom: 0; padding: 0; min-width: 0; }
  .action-value { margin-left: 0; }

  .tabs { width: 100%; margin-left: 0; }
  .tab { flex: 1; }
  .chart-head { flex-direction: column; align-items: stretch; }

  .metrics-row { display: flex; flex-direction: column; gap: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .metric-card { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 0; border-radius: 0; border-bottom: 1px solid var(--line-soft); min-height: 54px; }
  .metric-card:last-child { border-bottom: 0; }
  .metric-head { width: 92px; flex: none; }
  .metric-value { margin-top: 4px; font-size: 18px; }
  .metric-spark { flex: 1; height: 22px; margin-top: 0; width: auto; }
  .metric-trend { width: 74px; flex: none; text-align: right; margin-top: 0; }

  .telegram-form { flex-direction: row; }
  .telegram-form input { flex: 1; min-width: 0; width: auto; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <h1 class="brand">Тучка</h1>
    <span class="freshness" id="freshness"><span class="dot"></span><span class="txt">загрузка…</span></span>
  </header>

  <div class="layout">
    <div class="col-left">
      <div class="card hero-card">
        <div class="eyebrow" id="clock">сейчас</div>
        <div class="aqi-row">
          <span class="aqi-num" id="v-aqi">—</span>
          <span class="aqi-unit">AQI<br>US EPA</span>
        </div>
        <span class="badge" id="aqi-badge" hidden></span>
        <div class="scale"><div class="scale-marker" id="aqi-marker" hidden></div></div>
        <div class="verdict-title" id="verdict-title">—</div>
        <p class="verdict-body" id="verdict-body"></p>

        <div class="actions" id="actions" hidden></div>

        <div class="hero-section">
          <div class="hero-section-head">
            <h2>Худшие часы</h2>
            <span class="u">по часам суток</span>
          </div>
          <div class="hours" id="hours"></div>
          <div class="hours-labels"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div>
        </div>

        <div class="hero-section">
          <div class="hero-section-head">
            <h2>Сводка за 24 часа</h2>
            <span class="u">AQI</span>
          </div>
          <div id="summary"></div>
        </div>
      </div>
    </div>

    <div class="col-right">
      <div class="card chart-card">
        <div class="chart-head">
          <h2 id="chart-title">AQI</h2>
          <span class="u" id="period-note"></span>
          <div class="tabs" id="tabs" role="group" aria-label="Период"></div>
        </div>
        <div class="chart-row">
          <div class="y-axis" id="y-axis"></div>
          <div class="chart-plot" id="chart-plot">
            <div class="chart-baseline"></div>
            <svg class="chart-svg" viewBox="0 0 1000 300" preserveAspectRatio="none">
              <defs>
                <linearGradient id="aqiGrad" x1="0" y1="0" x2="1" y2="0"></linearGradient>
              </defs>
              <path id="chart-band" fill="url(#aqiGrad)" opacity="0.22"></path>
              <path id="chart-line" fill="none" stroke="url(#aqiGrad)" stroke-width="2.5"
                    vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"></path>
            </svg>
            <div class="chart-empty" id="chart-empty" hidden>нет данных за этот период</div>
            <div class="cursor-line" id="cursor-line"></div>
            <div class="cursor-dot" id="cursor-dot"></div>
            <div class="tooltip" id="tooltip">
              <div class="tw" id="tip-when"></div>
              <div class="ta"><span class="n" id="tip-aqi"></span><span class="c" id="tip-cat"></span></div>
              <div class="tr" id="tip-range"></div>
              <div class="tp" id="tip-pm"></div>
            </div>
          </div>
        </div>
        <div class="x-labels" id="x-labels"></div>
      </div>

      <div class="metrics-row" id="metrics"></div>

      <div class="card telegram-card">
        <div>
          <h2>Уведомления в телеграме</h2>
          <p>Бот напишет, когда AQI перейдёт за 100 — и когда вернётся в норму.</p>
        </div>
        <div class="telegram-form">
          <input placeholder="@username" disabled>
          <button disabled>Подписаться</button>
        </div>
        <div class="telegram-note">скоро</div>
      </div>
    </div>
  </div>

  <footer>
    <span id="footer-sensor"></span>
    <a href="/docs">API</a>
  </footer>
</div>

<script>
"use strict";

const $ = s => document.querySelector(s);

/* Категории US EPA AQI: официальные фон/текст + оттенок линии графика. */
const CATS = {
  good:           { label: "Хорошо",       color: "#c9ecb4", ink: "#1c4a15", line: "#3f9430" },
  moderate:       { label: "Умеренно",     color: "#f6e9a8", ink: "#4d3b00", line: "#b8912a" },
  usg:            { label: "Вредно чувствительным", color: "#f8d6b0", ink: "#5a2c04", line: "#d1762c" },
  unhealthy:      { label: "Вредно",       color: "#f4c4c4", ink: "#6b1414", line: "#c33b3b" },
  very_unhealthy: { label: "Очень вредно", color: "#dfc6e4", ink: "#4a1451", line: "#8f4c98" },
  hazardous:      { label: "Опасно",       color: "#3f0f1c", ink: "#f6e6ea", line: "#8a3550" },
};
/* Верхние границы категорий — зеркало CATEGORIES в server/aqi.py. */
const BANDS = [[50, "good"], [100, "moderate"], [150, "usg"],
               [200, "unhealthy"], [300, "very_unhealthy"], [500, "hazardous"]];
const catKey = v => (BANDS.find(b => v <= b[0]) || BANDS[BANDS.length - 1])[1];

const OK = "var(--good)", WARN = "var(--warn)", BAD = "var(--bad)";
const VERDICT = {
  good: { title: "Воздух чистый — окна настежь",
    body: "PM2.5 {pm25} мкг/м³, это ниже суточной нормы ВОЗ. Хорошее время проветрить квартиру и выйти на улицу.",
    actions: [["Окна", "настежь", OK], ["Прогулка", "да", OK], ["Спорт на улице", "да", OK]] },
  moderate: { title: "Окна можно открыть",
    body: "Воздух умеренный: PM2.5 {pm25} мкг/м³. Здоровым — без ограничений; если реагируете на пыль, не бегайте вдоль дороги.",
    actions: [["Окна", "да", OK], ["Прогулка", "да", OK], ["Спорт на улице", "с оглядкой", WARN]] },
  usg: { title: "Окна лучше прикрыть",
    body: "PM2.5 {pm25} мкг/м³ — заметная пыль. Детям, пожилым, астматикам стоит сократить время на улице; остальным — без долгих нагрузок.",
    actions: [["Окна", "прикрыть", WARN], ["Прогулка", "короткая", WARN], ["Спорт на улице", "перенести", BAD]] },
  unhealthy: { title: "Лучше остаться дома",
    body: "PM2.5 {pm25} мкг/м³ — вредно для всех. Держите окна закрытыми; если есть очиститель воздуха — включите.",
    actions: [["Окна", "закрыть", BAD], ["Прогулка", "нет", BAD], ["Спорт на улице", "нет", BAD]] },
  very_unhealthy: { title: "Закройте окна и не выходите",
    body: "PM2.5 {pm25} мкг/м³. Воздух очень вредный: выходить только по необходимости и в маске FFP2.",
    actions: [["Окна", "закрыть", BAD], ["Прогулка", "нет", BAD], ["Спорт на улице", "нет", BAD]] },
  hazardous: { title: "Опасный воздух — герметизируйте дом",
    body: "PM2.5 {pm25} мкг/м³. Это уровень аварийной ситуации: закройте всё, включите очиститель, улицы избегайте.",
    actions: [["Окна", "закрыть", BAD], ["Прогулка", "нет", BAD], ["Спорт на улице", "нет", BAD]] },
};

/* Скользящие окна — зеркало PERIODS в server/main.py. */
const PERIODS = [
  { key: "24h", label: "24ч", note: "последние 24 часа · по часам" },
  { key: "7d", label: "7д", note: "последние 7 дней · по 3 часа" },
  { key: "30d", label: "30д", note: "последние 30 дней · по дням" },
  { key: "12m", label: "12м", note: "последние 12 месяцев · по 2 дня" },
  { key: "all", label: "всё", note: "вся история · по 2 недели" },
];

/* Селектор периода скрываем, пока реальных данных недостаточно, чтобы
   заполнить график (иначе почти пустая линия на фоне пустой сетки).
   "12m" и "all" делят один и тот же порог: пока данных меньше трети
   года, "all" всё равно совпадает с "12m" и выглядит так же пусто. */
const FILL_THRESHOLD = 0.3;
const FILL_REF_S = { "7d": 7 * 86400, "30d": 30 * 86400, "12m": 364 * 86400, "all": 364 * 86400 };
let dataSpanS = 0; // now - first_ts, обновляется из ответа /api/v1/history

function periodVisible(key) {
  return key === "24h" || dataSpanS / FILL_REF_S[key] >= FILL_THRESHOLD;
}

/* Единый набор показателей: карточки внизу и большой график сверху читают отсюда.
   [название, ключ, единица, знаков после запятой, опции тренда, мин. размах, шаг оси Y] */
const METRIC_DEFS = [
  ["AQI", "aqi", "", 0, { digits: 0, eps: 3 }, 12, 5],
  ["PM2.5", "pm25", "мкг/м³", 1, { eps: 0.5, worseUp: true }, 6, 1],
  ["PM10", "pm10", "мкг/м³", 1, { eps: 0.5, worseUp: true }, 10, 1],
  ["Температура", "temperature", "°C", 1, { unit: "°", eps: 0.3 }, 6, 1],
  ["Влажность", "humidity", "%", 0, { digits: 0, unit: "%", eps: 1 }, 12, 5],
  ["Давление", "pressure", "гПа", 0, { digits: 0, eps: 0.5 }, 5, 5],
];
const metricDef = key => METRIC_DEFS.find(m => m[1] === key) || METRIC_DEFS[0];

const fmt = (v, d = 1) => (v == null ? "—" : Number(v).toFixed(d).replace(".", ","));

/* Catmull-Rom → кубические Безье: мягкая линия вместо ломаной. */
function smoothPath(ps, startWith) {
  if (!ps.length) return "";
  const f = v => v.toFixed(1);
  const d = [(startWith || "M") + f(ps[0].x) + " " + f(ps[0].y)];
  for (let i = 1; i < ps.length; i++) {
    const p0 = ps[i - 2] || ps[i - 1], p1 = ps[i - 1], p2 = ps[i], p3 = ps[i + 1] || ps[i];
    d.push("C" + f(p1.x + (p2.x - p0.x) / 6) + " " + f(p1.y + (p2.y - p0.y) / 6) +
      " " + f(p2.x - (p3.x - p1.x) / 6) + " " + f(p2.y - (p3.y - p1.y) / 6) +
      " " + f(p2.x) + " " + f(p2.y));
  }
  return d.join(" ");
}

/* Скользящее среднее — игнорирует пропуски (null), сам null не заполняет. */
function rolling(vals, k) {
  if (k < 2) return vals.slice();
  const r = Math.floor(k / 2);
  return vals.map((v, i) => {
    if (v == null) return null;
    let s = 0, c = 0;
    for (let j = Math.max(0, i - r); j <= Math.min(vals.length - 1, i + r); j++) {
      if (vals[j] != null) { s += vals[j]; c++; }
    }
    return c ? s / c : null;
  });
}

/* Даунсэмплинг для спарклайнов; пропуски в срезе игнорируются. */
function sample(vals, n) {
  if (vals.length <= n) return vals;
  const out = [];
  const step = vals.length / n;
  for (let i = 0; i < n; i++) {
    const a = Math.floor(i * step), b = Math.max(a + 1, Math.floor((i + 1) * step));
    const slice = vals.slice(a, b).filter(v => v != null);
    out.push(slice.length ? slice.reduce((s, v) => s + v, 0) / slice.length : null);
  }
  return out;
}

/* Средняя разница между началом и концом периода (сглажена по краям). */
function trend(pts, key) {
  const vals = pts.map(p => p[key]).filter(v => v != null);
  if (vals.length < 2) return null;
  const k = Math.max(1, Math.min(3, Math.floor(vals.length / 2)));
  const avg = a => a.reduce((s, x) => s + x, 0) / a.length;
  return avg(vals.slice(-k)) - avg(vals.slice(0, k));
}

function trendText(delta, { digits = 1, unit = "", eps = 0.5, worseUp = false } = {}) {
  if (delta == null) return { arrow: "", text: "", color: "var(--muted)" };
  if (Math.abs(delta) < eps) return { arrow: "→", text: "без изменений", color: "var(--muted)" };
  const up = delta > 0;
  return {
    arrow: up ? "▲" : "▼",
    text: (up ? "+" : "−") + fmt(Math.abs(delta), digits) + unit,
    color: worseUp ? (up ? BAD : OK) : "var(--muted)",
  };
}

function timeLabel(tSec, period, full) {
  const d = new Date(tSec * 1000);
  if (period === "24h") return d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  if (period === "7d") return full
    ? d.toLocaleDateString("ru-RU", { day: "2-digit", month: "short" }) + ", " + d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })
    : d.toLocaleDateString("ru-RU", { weekday: "short" });
  if (period === "30d" || period === "12m") return d.toLocaleDateString("ru-RU", { day: "2-digit", month: "short" });
  return d.toLocaleDateString("ru-RU", { month: "short", year: "2-digit" });
}

/* --- состояние --- */
let period = "24h";
let activeMetric = "aqi";  // ключ показателя, который сейчас на большом графике
let mainHistory = null;   // /history для выбранного периода
let dayHistory = null;    // /history?period=24h — всегда, для «худших часов» и сводки
let historyGen = 0;
let historyRetry = null;
let current = null;       // последний ответ /api/v1/current
let currentAgeAt = 0;

/* геометрия текущего графика — обновляется в renderChart, читается в updateTooltip */
let chartPts = [];
let chartTop = 100, chartBottom = 0, chartHasBand = false;

function fmtAge(s) {
  if (s < 90) return `${s} с назад`;
  if (s < 5400) return `${Math.round(s / 60)} мин назад`;
  return `${(s / 3600).toFixed(1).replace(".", ",")} ч назад`;
}

function renderFreshness() {
  const el = $("#freshness");
  const txt = el.querySelector(".txt");
  if (!current || current.ts == null) {
    txt.textContent = "данных пока нет";
    el.classList.add("stale");
    return;
  }
  const age = Math.max(0, Math.round(current.age_s + (Date.now() - currentAgeAt) / 1000));
  const stale = age > 300;
  el.classList.toggle("stale", stale);
  txt.textContent = (stale ? "данные устарели — " : "обновлено ") + fmtAge(age);
}

function updateClock() {
  const now = new Date();
  const pad = n => (n < 10 ? "0" + n : "" + n);
  $("#clock").textContent = `сейчас · ${pad(now.getHours())}:${pad(now.getMinutes())}`;
}

function renderHero() {
  const numEl = $("#v-aqi"), badge = $("#aqi-badge"), marker = $("#aqi-marker"),
        titleEl = $("#verdict-title"), bodyEl = $("#verdict-body"), actionsEl = $("#actions");
  const info = current && current.aqi;
  const cat = info && info.category && CATS[info.category];
  if (!info || info.aqi == null || !cat) {
    numEl.textContent = "—";
    numEl.style.color = "";
    badge.hidden = true;
    marker.hidden = true;
    titleEl.textContent = "Пока нет данных";
    bodyEl.textContent = "Недостаточно измерений за последние 12 часов, чтобы посчитать AQI.";
    actionsEl.hidden = true;
    actionsEl.innerHTML = "";
    return;
  }
  const v = VERDICT[info.category];
  numEl.textContent = info.aqi;
  numEl.style.color = cat.line;
  badge.hidden = false;
  badge.textContent = cat.label;
  badge.style.background = cat.color;
  badge.style.color = cat.ink;
  marker.hidden = false;
  marker.style.left = Math.min(100, info.aqi / 5) + "%";
  titleEl.textContent = v.title;
  bodyEl.textContent = v.body.replace("{pm25}", fmt(current.pm25));
  actionsEl.hidden = false;
  actionsEl.innerHTML = v.actions.map(([name, value, color]) =>
    `<div class="action-row"><span class="dot" style="background:${color}"></span>` +
    `<span class="action-name">${name}</span><span class="action-value">${value}</span></div>`
  ).join("");
}

function renderDaySummary() {
  const pts = (dayHistory && dayHistory.points) || [];
  const byHour = {};
  for (const p of pts) {
    if (p.aqi == null) continue;
    const h = new Date(p.t * 1000).getHours();
    (byHour[h] = byHour[h] || []).push(p.aqi);
  }
  const hourVals = [];
  for (let h = 0; h < 24; h++) {
    const arr = byHour[h];
    hourVals.push(arr ? arr.reduce((s, x) => s + x, 0) / arr.length : null);
  }
  const hourMax = Math.max(...hourVals.filter(x => x != null), 50);
  $("#hours").innerHTML = hourVals.map(val => {
    const height = val == null ? "6%" : Math.max(7, val / hourMax * 100).toFixed(0) + "%";
    const color = val == null ? "var(--line-soft)" : CATS[catKey(val)].line;
    return `<div class="bar" style="height:${height};background:${color}"></div>`;
  }).join("");

  const dayAqi = pts.map(p => p.aqi).filter(v => v != null);
  const pad2 = n => (n < 10 ? "0" + n : "" + n);
  if (!dayAqi.length) {
    $("#summary").innerHTML = `<div class="summary-row"><span class="summary-name">Нет данных за 24 часа</span></div>`;
    return;
  }
  const worstIdx = hourVals.reduce((bi, val, i) => (val != null && (hourVals[bi] == null || val > hourVals[bi]) ? i : bi), 0);
  const rows = [
    { name: "Минимум", value: Math.round(Math.min(...dayAqi)), note: "", color: CATS[catKey(Math.min(...dayAqi))].line },
    { name: "Среднее", value: Math.round(dayAqi.reduce((s, x) => s + x, 0) / dayAqi.length), note: "", color: "var(--ink-2)" },
    { name: "Максимум", value: Math.round(Math.max(...dayAqi)), note: "в " + pad2(worstIdx) + ":00", color: CATS[catKey(Math.max(...dayAqi))].line },
  ];
  $("#summary").innerHTML = rows.map(r =>
    `<div class="summary-row"><span class="summary-name">${r.name}</span>` +
    `<span class="summary-note">${r.note}</span>` +
    `<span class="summary-value" style="color:${r.color}">${r.value}</span></div>`
  ).join("");
}

function metricCardHtml(pts, [name, key, unit, digits, topts, minSpan]) {
  const raw = sample(pts.map(p => p[key]), 48);
  const vals = rolling(raw, Math.max(3, Math.round(raw.length / 8)));
  const nums = vals.filter(v => v != null);
  let sparkPath = "";
  if (nums.length) {
    const min = Math.min(...nums), max = Math.max(...nums);
    const mid = (min + max) / 2;
    const half = Math.max((max - min) * 0.65, minSpan / 2) || 1;
    const lo = mid - half, hi = mid + half;
    const runs = [];
    let cur = [];
    vals.forEach((v, i) => {
      if (v == null) { if (cur.length) runs.push(cur); cur = []; }
      else cur.push({ x: i / Math.max(1, vals.length - 1) * 100, y: 22 - (v - lo) / (hi - lo) * 22 });
    });
    if (cur.length) runs.push(cur);
    sparkPath = runs.map(r => smoothPath(r)).join(" ");
  }
  const curValue = key === "aqi" ? (current && current.aqi ? current.aqi.aqi : null) : (current ? current[key] : null);
  const t = trendText(trend(pts, key), topts);
  // спарклайны «воздушных» показателей красим в цвет текущей категории AQI
  const catLine = current && current.aqi && current.aqi.category && CATS[current.aqi.category]
    ? CATS[current.aqi.category].line : "var(--ink)";
  const stroke = ["aqi", "pm25", "pm10"].includes(key) ? catLine : "var(--muted)";
  return `<div class="metric-card${key === activeMetric ? " active" : ""}" data-metric="${key}">` +
    `<div class="metric-head"><div class="metric-name">${name}</div>` +
    `<div class="metric-value"><span>${fmt(curValue, digits)}</span><span class="unit">${unit}</span></div></div>` +
    `<svg class="metric-spark" viewBox="0 0 100 22" preserveAspectRatio="none">` +
    `<path d="${sparkPath}" fill="none" stroke="${stroke}" ` +
    `stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"></path></svg>` +
    `<div class="metric-trend" style="color:${t.color}">${t.arrow} ${t.text}</div></div>`;
}

function renderMetrics() {
  const pts = (mainHistory && mainHistory.points) || [];
  $("#metrics").innerHTML = METRIC_DEFS.map(def => metricCardHtml(pts, def)).join("");
}

function renderChart() {
  const key = activeMetric;
  const selDef = metricDef(key);
  const isAqi = key === "aqi";
  const digits = selDef[3], minSpan = selDef[5], step = selDef[6];
  const pts = (mainHistory && mainHistory.points) || [];
  chartPts = pts;
  const n = pts.length;
  const empty = $("#chart-empty");
  const hasAny = pts.some(p => p[key] != null);
  $("#chart-title").textContent = selDef[0];
  $("#period-note").textContent = (PERIODS.find(p => p.key === period) || PERIODS[0]).note;

  hideTooltip();
  if (!hasAny) {
    empty.hidden = false;
    $("#chart-line").setAttribute("d", "");
    $("#chart-band").setAttribute("d", "");
    $("#y-axis").innerHTML = "";
    document.querySelectorAll(".gridline").forEach(el => el.remove());
    $("#x-labels").innerHTML = "";
    return;
  }
  empty.hidden = true;

  const W = 1000, H = 300;
  const smoothK = Math.max(3, Math.round(n / 12));
  const hasBand = isAqi && pts.some(p => p.aqi_hi != null && p.aqi_lo != null && p.aqi_hi - p.aqi_lo > 1);
  chartHasBand = hasBand;
  const hiVals = hasBand ? rolling(rolling(pts.map(p => p.aqi_hi), smoothK), smoothK) : null;
  const loVals = hasBand ? rolling(rolling(pts.map(p => p.aqi_lo), smoothK), smoothK) : null;
  const midVals = rolling(pts.map(p => p[key]), smoothK);

  const nums = arr => arr.filter(v => v != null);
  const dataMax = Math.max(...nums(hasBand ? hiVals : midVals));
  const dataMin = Math.min(...nums(hasBand ? loVals : midVals));
  // шкала по данным, а не от нуля; ниже нуля опускаемся только там, где это осмысленно (температура)
  const pad = Math.max(minSpan / 2, (dataMax - dataMin) * 0.25);
  const top = Math.ceil((dataMax + pad) / step) * step;
  const rawBottom = Math.floor((dataMin - pad) / step) * step;
  const bottom = key === "temperature" ? rawBottom : Math.max(0, rawBottom);
  const span = top - bottom || 1;
  chartTop = top;
  chartBottom = bottom;

  const X = i => (n === 1 ? W / 2 : i / (n - 1) * W);
  const Y = v => Math.max(0.5, Math.min(H - 0.5, H - (v - bottom) / span * H));
  const yPct = val => ((1 - (val - bottom) / span) * 100).toFixed(2) + "%";

  // линия по сегментам между пропусками (null-корзины не соединяем)
  function segPath(vals) {
    const runs = [];
    let cur = [];
    vals.forEach((v, i) => {
      if (v == null) { if (cur.length) runs.push(cur); cur = []; }
      else cur.push({ x: X(i), y: Y(v) });
    });
    if (cur.length) runs.push(cur);
    return runs.map(r => smoothPath(r)).join(" ");
  }
  function bandPathOf(hi, lo) {
    const runs = [];
    let cur = [];
    hi.forEach((hv, i) => {
      const lv = lo[i];
      if (hv == null || lv == null) { if (cur.length > 1) runs.push(cur); cur = []; }
      else cur.push(i);
    });
    if (cur.length > 1) runs.push(cur);
    return runs.map(r => {
      const hiPts = r.map(i => ({ x: X(i), y: Y(hi[i]) }));
      const loPts = r.map(i => ({ x: X(i), y: Y(lo[i]) })).reverse();
      return smoothPath(hiPts) + " " + smoothPath(loPts, "L") + " Z";
    }).join(" ");
  }

  $("#chart-line").setAttribute("d", segPath(midVals));
  $("#chart-band").setAttribute("d", hasBand ? bandPathOf(hiVals, loVals) : "");

  // AQI — градиент по категории значения в каждой точке; прочие метрики — ровный цвет
  const stops = [];
  if (isAqi) {
    let prevStop = null;
    midVals.forEach((v, i) => {
      if (v == null) return;
      const c = CATS[catKey(v)].line;
      const off = (n === 1 ? 0 : i / (n - 1) * 100).toFixed(2) + "%";
      if (!prevStop) stops.push({ o: "0%", c });
      else if (c !== prevStop.c) { stops.push({ o: off, c: prevStop.c }); stops.push({ o: off, c }); }
      prevStop = { c, off };
    });
    if (prevStop) stops.push({ o: "100%", c: prevStop.c });
  } else {
    stops.push({ o: "0%", c: "var(--ink-2)" }, { o: "100%", c: "var(--ink-2)" });
  }
  $("#aqiGrad").innerHTML = stops.map(s => `<stop offset="${s.o}" stop-color="${s.c}"></stop>`).join("");

  // сетка Y: у AQI — пороги категорий их же цветом, у остальных — ровные четверти шкалы
  const gridVals = (isAqi ? [25, 50, 75, 100, 150, 200, 300] : [0.25, 0.5, 0.75].map(f => bottom + span * f))
    .filter(v => v > bottom + span * 0.06 && v < top - span * 0.06);
  document.querySelectorAll(".gridline").forEach(el => el.remove());
  const plot = $("#chart-plot");
  for (const v of gridVals) {
    const el = document.createElement("div");
    el.className = "gridline";
    el.style.top = yPct(v);
    el.style.borderColor = isAqi ? CATS[catKey(v)].line : "var(--line-strong)";
    plot.insertBefore(el, plot.firstChild);
  }
  const gridLabel = v => isAqi ? v : fmt(v, digits);
  $("#y-axis").innerHTML =
    `<span class="yfix ytop">${gridLabel(top)}</span>` +
    gridVals.map(v => `<span class="gridlabel" style="top:${yPct(v)}">${gridLabel(v)}</span>`).join("") +
    `<span class="yfix ybottom">${gridLabel(bottom)}</span>`;

  // подписи оси X
  const xs = [0, 0.25, 0.5, 0.75, 1].map(f => timeLabel(pts[Math.min(n - 1, Math.round(f * (n - 1)))].t, period));
  $("#x-labels").innerHTML = xs.map(l => `<span>${l}</span>`).join("");
}

function hideTooltip() {
  $("#cursor-line").style.display = "none";
  $("#cursor-dot").style.display = "none";
  $("#tooltip").style.display = "none";
}

function updateTooltip(i) {
  const n = chartPts.length;
  if (!n) return;
  i = Math.max(0, Math.min(n - 1, i));
  const p = chartPts[i];
  const key = activeMetric;
  const isAqi = key === "aqi";
  const selDef = metricDef(key);
  const val = p[key];
  const leftPct = n === 1 ? 50 : i / (n - 1) * 100;
  $("#cursor-line").style.display = "block";
  $("#cursor-line").style.left = leftPct + "%";

  if (val == null) {
    $("#cursor-dot").style.display = "none";
    $("#tip-when").textContent = timeLabel(p.t, period, true);
    $("#tip-aqi").textContent = "—";
    $("#tip-cat").textContent = "нет данных";
    $("#tip-range").textContent = "";
    $("#tip-pm").textContent = "";
    positionTooltip(leftPct);
    return;
  }
  const span = chartTop - chartBottom || 1;
  const yPct = ((1 - (val - chartBottom) / span) * 100);
  const color = isAqi ? CATS[catKey(val)].line : "var(--ink-2)";

  $("#cursor-dot").style.display = "block";
  $("#cursor-dot").style.left = leftPct + "%";
  $("#cursor-dot").style.top = yPct + "%";
  $("#cursor-dot").style.background = color;
  $("#tip-when").textContent = timeLabel(p.t, period, true);
  $("#tip-aqi").textContent = isAqi ? Math.round(val) : fmt(val, selDef[3]);
  $("#tip-aqi").style.color = color;
  $("#tip-cat").textContent = isAqi ? CATS[catKey(val)].label : selDef[2];
  // у AQI вторая строка — разброс внутри корзины, у прочих метрик — сам AQI как контекст
  $("#tip-range").textContent = isAqi
    ? (chartHasBand && p.aqi_hi != null && p.aqi_lo != null
        ? `диапазон ${Math.round(p.aqi_lo)}–${Math.round(p.aqi_hi)}`
        : (p.pm25 != null ? `PM2.5 ${fmt(p.pm25)}` : ""))
    : (p.aqi != null ? `AQI ${Math.round(p.aqi)}` : "");
  $("#tip-pm").textContent = (p.pm25 != null || p.pm10 != null)
    ? `PM2.5 ${fmt(p.pm25)} · PM10 ${fmt(p.pm10, 0)}` : "";
  positionTooltip(leftPct);
}

function positionTooltip(leftPct) {
  const tip = $("#tooltip");
  tip.style.display = "block";
  tip.style.left = Math.min(84, Math.max(16, leftPct)) + "%";
}

async function loadCurrent() {
  try {
    const r = await fetch("/api/v1/current");
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    current = await r.json();
    currentAgeAt = Date.now();
    if (current.ts == null) current.age_s = null;
    const sensorEl = $("#footer-sensor");
    sensorEl.textContent = current.sensor_id ? `airRohr ${current.sensor_id}` : "";
    renderHero();
    renderMetrics();
  } catch (e) { /* сеть мигнула — оставляем прежние значения */ }
  renderFreshness();
}

async function fetchHistory(p) {
  const tzOffset = -new Date().getTimezoneOffset();
  const r = await fetch(`/api/v1/history?period=${p}&tz_offset=${tzOffset}`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function loadHistory() {
  const gen = ++historyGen;
  let main, day;
  try {
    if (period === "24h") {
      main = await fetchHistory("24h");
      day = main;
    } else {
      [main, day] = await Promise.all([fetchHistory(period), fetchHistory("24h")]);
    }
  } catch (e) {
    if (!historyRetry) historyRetry = setTimeout(() => { historyRetry = null; loadHistory(); }, 15_000);
    return;
  }
  if (gen !== historyGen) return; // пришёл ответ на устаревший запрос
  mainHistory = main;
  dayHistory = day;
  if (day.first_ts != null) dataSpanS = day.end - day.first_ts;
  buildTabs();
  renderChart();
  renderMetrics();
  renderDaySummary();
}

function buildTabs() {
  $("#tabs").innerHTML = PERIODS.filter(p => periodVisible(p.key)).map(p =>
    `<button class="tab" data-period="${p.key}" aria-pressed="${p.key === period}">${p.label}</button>`
  ).join("");
  for (const btn of document.querySelectorAll(".tab")) {
    btn.addEventListener("click", () => {
      period = btn.dataset.period;
      for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-pressed", String(b === btn));
      loadHistory();
    });
  }
}

$("#chart-plot").addEventListener("mousemove", e => {
  if (!chartPts.length) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  updateTooltip(Math.round(frac * (chartPts.length - 1)));
});
$("#chart-plot").addEventListener("mouseleave", hideTooltip);

$("#metrics").addEventListener("click", e => {
  const card = e.target.closest(".metric-card");
  if (!card || card.dataset.metric === activeMetric) return;
  activeMetric = card.dataset.metric;
  renderChart();
  renderMetrics();
});

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { renderChart(); renderMetrics(); });

buildTabs();
updateClock();
loadCurrent();
loadHistory();
setInterval(loadCurrent, 60_000);
setInterval(loadHistory, 300_000);
setInterval(() => { renderFreshness(); updateClock(); }, 10_000);
</script>
</body>
</html>
