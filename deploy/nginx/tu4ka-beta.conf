# Бета. Ставится бета-деплоем и только когда есть lineage beta.amqi.am.
#
# Отдельный поддомен, а не префикс пути /beta: server/static/index.html ходит
# по корневым путям (/static/..., fetch("/api/v1/...")), и на префиксе страница
# беты молча читала бы API прода. Плюс будущие __Host- куки сессий столкнулись
# бы на общем хосте.

# Своя зона, чтобы файл не зависел от того, поставлен ли tu4ka.conf.
limit_req_zone $binary_remote_addr zone=tu4ka_beta:1m rate=30r/m;

server {
    listen 80;
    server_name beta.amqi.am;

    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # default_server здесь не ставить: он уже занят продом, и второй вызвал бы
    # ошибку конфигурации.
    listen 443 ssl http2;
    server_name beta.amqi.am;

    client_max_body_size 128k;

    ssl_certificate     /etc/letsencrypt/live/beta.amqi.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta.amqi.am/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 1d;

    # На уровне server и БЕЗ единого add_header внутри location: любой
    # add_header в локации сбрасывает унаследованные, и noindex бы исчез.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location / {
        limit_req zone=tu4ka_beta burst=20 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
