# Общий фронт. Ставится ТОЛЬКО прод-деплоем (TU4KA_ENV=prod): здесь живёт
# default_server на :80 — путь, по которому ходит датчик.
#
# Датчик прошит на голый IP http://178.160.230.131/api/v1/push с basic auth и
# шлёт раз в 60 с, не буферизуя и не ретраясь. Поэтому:
#   * редиректа на HTTPS здесь нет и быть не должно — при кросс-схемном
#     редиректе теряется заголовок Authorization, и на 307 прошивка может
#     вообще не пойти;
#   * любая минута недоступности — безвозвратная дыра в истории.

# Датчик шлёт 1 запрос в минуту; 30r/m — тридцатикратный запас, но чужой
# любопытный скрипт уже упрётся.
limit_req_zone $binary_remote_addr zone=tu4ka_push:1m rate=30r/m;
limit_req_status 429;

# Голый IP и любое имя, для которого нет своего блока.
server {
    listen 80 default_server;
    server_name _;

    # 128k против 64k, которые режет server/routes/push.py: 413 остаётся
    # ответом приложения, а не nginx — так в логах видно, что именно пришло.
    client_max_body_size 128k;

    # ACME-локация нужна в каждом :80-блоке, включая редиректящие, иначе
    # продление сертификата однажды молча упрётся.
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }

    location /api/v1/push {
        limit_req zone=tu4ka_push burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Приём по имени. Заготовка на случай, если ingest уедет на другую машину:
# тогда меняется A-запись, а не прошивка. Тоже HTTP:80 и тоже без редиректа.
server {
    listen 80;
    server_name push.amqi.am;

    client_max_body_size 128k;

    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }

    location / {
        limit_req zone=tu4ka_push burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
