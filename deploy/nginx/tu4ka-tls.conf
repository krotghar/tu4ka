# TLS для сайта. Ставится только когда lineage /etc/letsencrypt/live/amqi.am
# уже существует: это единственный файл, называющий сертификат, и пока
# сертификата нет, nginx с ним просто не стартует.

server {
    listen 80;
    server_name amqi.am www.amqi.am;

    # Порядок важен: ACME-локация отдельным location, а редирект — внутри
    # `location /`, а не `return 301` на уровне server. Server-level return
    # срабатывает до выбора локации и съел бы проверку при продлении.
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # default_server на :443 задан явно у прода. Без него дефолтным стал бы
    # блок из файла, загруженного первым (tu4ka-beta.conf идёт раньше по
    # алфавиту), и https по чужому имени отдавал бы бету.
    # `http2` в listen-строке, а не отдельной директивой `http2 on;`:
    # на сервере nginx 1.24, отдельная директива появилась только в 1.25.1.
    listen 443 ssl http2 default_server;
    server_name amqi.am www.amqi.am;

    client_max_body_size 128k;

    ssl_certificate     /etc/letsencrypt/live/amqi.am/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amqi.am/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 1d;

    # Без includeSubDomains: он заставил бы браузеры ходить на push.amqi.am по
    # HTTPS, а приём намеренно живёт на HTTP.
    add_header Strict-Transport-Security "max-age=15552000" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
